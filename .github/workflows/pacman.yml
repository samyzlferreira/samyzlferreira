name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # O modo "pacman" é ativado automaticamente pelo Platane/snk
          # As cores abaixo garantem o visual clássico
          outputs: |
            dist/github-snake.svg?color_snake=red&color_dots=#bfd6f6&color_fork=blue
            dist/github-snake-dark.svg?palette=github-dark&color_snake=red&color_dots=#bfd6f6&color_fork=blue

      - name: Push generated SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
